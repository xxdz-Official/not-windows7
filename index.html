                    <span>显示</span>
                </li>
                <li class="context-menu-item">
                    <img src="img/gadgets.webp" alt="Gadgets图标" style="width:16px;height:16px;margin-right:8px;flex-shrink:0;">
                    <span>小组件</span>
                </li>
                <li class="context-menu-item">
                    <img src="img/personal.webp" alt="个性化图标" style="width:16px;height:16px;margin-right:8px;flex-shrink:0;">

    <script>
        // ============ 窗口拖动功能 ============
        // 使用函数获取最新窗口元素，而不是固定引用
        function getWindowEl() {
            return document.getElementById('mainWindow');
        }
        function getTitlebar() {
            return document.getElementById('titlebar');
        }
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let edgeTriggered = false;

        console.log('[DEBUG] 窗口拖动功能已初始化');

        // ============ 任务栏进入动画 ============
        (function initTaskbarAnimation() {
            const tb = document.querySelector('.taskbar');
            if (tb) {
                tb.style.transform = 'translateY(100%)';
                tb.style.transition = 'transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                setTimeout(() => {
                    tb.style.transform = 'translateY(0)';
                }, 1000);
            }
        })();

        // ============ 播放开机音效（使用Audio元素） ============
        let bootSoundPlayed = false;

        function playBootSound() {
            if (bootSoundPlayed) return;
            bootSoundPlayed = true;

            try {
                const audio = document.createElement('audio');
                audio.src = 'img/Windows7开机.wav';
                audio.volume = 0.5;
                audio.play().catch(e => console.log('[DEBUG] 开机音效播放失败:', e));
                console.log('[DEBUG] 开机音效已触发');
            } catch(e) {
                console.log('[DEBUG] 开机音效初始化失败:', e);
            }
        }

        // 用户点击页面时触发（只触发一次）
        document.addEventListener('click', function() {
            playBootSound();
        }, { once: true });

        // 触摸设备首次触摸时触发
        document.addEventListener('touchstart', function() {
            playBootSound();
        }, { once: true });

        // 标题栏拖拽事件使用动态绑定，在reset时重新绑定
        function bindTitlebarDrag() {
            const titlebar = getTitlebar();
            if (!titlebar) return;
            // 移除旧监听器（通过克隆替换方式，或使用新监听器）
            // 直接添加新监听器，但为了避免重复，先移除所有监听器
            const newTitlebar = titlebar.cloneNode(true);
            titlebar.parentNode.replaceChild(newTitlebar, titlebar);
            // 更新ID
            newTitlebar.id = 'titlebar';

            newTitlebar.addEventListener('mousedown', (e) => {
                const windowEl = getWindowEl();
                if (!windowEl) return;
                console.log('[DEBUG] mousedown 标题栏');
                e.preventDefault();
                e.stopPropagation();
                // 记录当前正在拖拽的窗口（主窗口）
                currentlyDraggingWindow = windowEl;
                // 激活窗口
                windowEl.classList.remove('inactive');
                // 恢复模糊层模糊程度
                const blurEl = document.getElementById('windowBlur');
                if (blurEl) {
                    blurEl.style.backdropFilter = 'blur(10px)';
                    blurEl.style.webkitBackdropFilter = 'blur(10px)';
                }
                // 切换任务栏标签为激活状态
                const tabImage = document.getElementById('tabImage');
                if (tabImage) {
                    tabImage.src = 'img/任务xxdzDM_alpha1.png';
                }
                isDragging = true;
                edgeTriggered = false;
                const rect = windowEl.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
                windowEl.style.cursor = 'grabbing';
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', stopDrag);
                console.log('[DEBUG] isDragging = true, edgeTriggered = false, 当前拖拽窗口: mainWindow');
            });
            return newTitlebar;
        }
        // 初始绑定
        bindTitlebarDrag();

        function onDrag(e) {
            console.log('[DEBUG] onDrag 触发, isDragging =', isDragging);
            if (!isDragging) {
                console.log('[DEBUG] onDrag 跳过, isDragging = false');
                return;
            }
            const windowEl = getWindowEl();
            if (!windowEl) {
                console.log('[DEBUG] onDrag 跳过, windowEl 不存在');
                return;
            }
            const desktop = document.getElementById('desktop');
            const desktopRect = desktop.getBoundingClientRect();
            let x = e.clientX - desktopRect.left - dragOffsetX;
            let y = e.clientY - desktopRect.top - dragOffsetY;
            windowEl.style.left = x + 'px';
            windowEl.style.top = y + 'px';
            // 模糊层跟随窗口（偏移量：左+12px，上+10px）
            const blurEl = document.getElementById('windowBlur');
            if (blurEl) {
                blurEl.style.left = (x + 12) + 'px';
                blurEl.style.top = (y + 11) + 'px';
            }
            // 清除居中的margin
            windowEl.style.marginLeft = '0px';
            windowEl.style.marginTop = '0px';
            if (blurEl) {
                blurEl.style.marginLeft = '0px';
                blurEl.style.marginTop = '0px';
            }

            // ===== 检测鼠标位置是否进入屏幕边缘触发区域（距离边缘50px） =====
            const EDGE_THRESHOLD = 50; // 边缘触发阈值
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            // 判断鼠标是否进入屏幕边缘区域
            const isMouseAtEdge = (mouseX < EDGE_THRESHOLD ||
                                   mouseX > window.innerWidth - EDGE_THRESHOLD ||
                                   mouseY < EDGE_THRESHOLD ||
                                   mouseY > window.innerHeight - EDGE_THRESHOLD);

            // 判断窗口是否完全移出屏幕（整个窗口都在屏幕外）
            const winRect = windowEl.getBoundingClientRect();
            const isFullyOut = (winRect.right < 0 || winRect.left > window.innerWidth ||
                               winRect.bottom < 0 || winRect.top > window.innerHeight);

            console.log('[DEBUG] 鼠标位置: (' + mouseX + ', ' + mouseY + ')');
            console.log('[DEBUG] isMouseAtEdge =', isMouseAtEdge, 'isFullyOut =', isFullyOut, 'edgeTriggered =', edgeTriggered);

            // ===== 场景1：鼠标进入边缘区域 → 仅触发系统窗口，不销毁 =====
            if (isMouseAtEdge && !edgeTriggered) {
                console.log('[DEBUG] 🟡 鼠标进入边缘区域！触发系统窗口（不销毁当前窗口）');
                edgeTriggered = true;
                // 仅触发后端创建系统窗口，不销毁当前窗口
                triggerSpawnWindow(e.clientX, e.clientY, 'edge');
                // 重置 edgeTriggered，允许再次触发（但用防抖避免频繁触发）
                setTimeout(() => {
                    edgeTriggered = false;
                }, 500);
            }

            // ===== 场景2：窗口完全移出屏幕 → 销毁窗口 + 触发系统窗口 =====
            if (isFullyOut && !edgeTriggered) {
                console.log('[DEBUG] 🟢 窗口已完全移出屏幕！销毁该窗口及其模糊层');
                edgeTriggered = true;

                // 立即获取模糊层引用（在销毁前）
                const blurElToRemove = document.getElementById('windowBlur');

                // 立即停止拖拽（即使鼠标未抬起）
                stopDrag();

                // 立即从DOM中移除主窗口
                if (windowEl.parentNode) {
                    windowEl.parentNode.removeChild(windowEl);
                }
                // 立即从DOM中移除模糊层
                if (blurElToRemove && blurElToRemove.parentNode) {
                    blurElToRemove.parentNode.removeChild(blurElToRemove);
                }
                // 隐藏任务栏标签（主标签）
                const mainTab = document.getElementById('taskbarTab');
                if (mainTab) {
                    mainTab.style.display = 'none';
                    mainTab.classList.remove('show');
                }
                console.log('[DEBUG] 🗑️ 主窗口及其模糊层已立即销毁');

                // 延迟触发其他窗口物理掉落
                setTimeout(() => {
                    console.log('[DEBUG] ⏰ 当前窗口已销毁，触发其他窗口掉落');
                    dropAllWindows();
                }, 300);
                // 同时尝试通知后端（不影响物理效果）
                triggerSpawnWindow(e.clientX, e.clientY, 'edge');
            }
        }

        function stopDrag() {
            console.log('[DEBUG] stopDrag 触发');
            isDragging = false;
            edgeTriggered = false;
            currentlyDraggingWindow = null; // 清除拖拽标记
            const windowEl = getWindowEl();
            if (windowEl) {
                windowEl.style.cursor = '';
            }
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
            console.log('[DEBUG] isDragging = false, edgeTriggered = false, 拖拽窗口已清除');
        }

        // 窗口尺寸变化时同步模糊层（偏移量固定：左+12px，上+10px）
        function syncBlurPosition() {
            const blurEl = document.getElementById('windowBlur');
            const windowEl = getWindowEl();
            if (blurEl && windowEl) {
                // 获取窗口当前的实际位置
                const rect = windowEl.getBoundingClientRect();
                const desktopRect = document.getElementById('desktop').getBoundingClientRect();
                const leftVal = rect.left - desktopRect.left;
                const topVal = rect.top - desktopRect.top;
                // 模糊层相对窗口偏移：left+12px，top+10px
                blurEl.style.left = (leftVal + 12) + 'px';
                blurEl.style.top = (topVal + 11) + 'px';
                // 清除居中margin
                blurEl.style.marginLeft = '0px';
                blurEl.style.marginTop = '0px';
            }
        }

        // 在窗口显示后同步位置
        function syncBlurPositionDelayed() {
            setTimeout(syncBlurPosition, 50);
        }

        // 修改 showWindow 函数，显示后同步模糊层位置
        const originalShowWindow = showWindow;
        showWindow = function() {
            originalShowWindow();
            syncBlurPositionDelayed();
        };

        // ============ 窗口通信功能 ============
        const BACKEND_URL = 'http://127.0.0.1:5000/api/message';
        let lastMessage = '你好后端';

        // ============ 监听窗口尺寸变化，实时重排任务栏标签 ============
        window.addEventListener('resize', function() {
            // 防抖：延迟执行，避免频繁重排
            clearTimeout(window._resizeTimer);
            window._resizeTimer = setTimeout(function() {
                rearrangeTaskbarTabs();
                console.log('[DEBUG] 📐 窗口尺寸变化，已重排任务栏标签');
            }, 100);
        });

        // 调试信息已替换为盗版提示文本（静态），不再动态更新

        async function sendMessage(text) {
            if (!text.trim()) {
                updateDebugInfo(' 请输入内容');
                return;
            }

            updateDebugInfo(' 发送中: ' + text.trim());

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: text.trim() }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                updateDebugInfo(' ' + (data.reply || '收到回复'));
            } catch (error) {
                console.error('请求失败:', error);
                updateDebugInfo(' 连接失败，请确保后端已启动');
            }
        }

        // 按回车键发送（用于演示，但窗口已无输入框，保留功能以备后续）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendMessage(lastMessage);
            }
        });



        // ============ 点击窗口激活/失焦 ============
        const tabImage = document.getElementById('tabImage');

        // 窗口获得焦点（点击窗口本身或标题栏）使用动态绑定
        function bindWindowClick() {
            const windowEl = getWindowEl();
            if (!windowEl) return;
            // 移除旧监听器
            const newWindow = windowEl.cloneNode(true);
            windowEl.parentNode.replaceChild(newWindow, windowEl);
            // 重新获取引用并绑定
            const newWindowEl = getWindowEl();
            if (!newWindowEl) return;

            newWindowEl.addEventListener('mousedown', (e) => {
                // 如果点击的是关闭按钮，不处理
                if (e.target.closest('.window-close-btn')) {
                    return;
                }
                newWindowEl.classList.remove('inactive');
                // 恢复模糊层模糊程度
                const blurEl = document.getElementById('windowBlur');
                if (blurEl) {
                    blurEl.style.backdropFilter = 'blur(10px)';
                    blurEl.style.webkitBackdropFilter = 'blur(10px)';
                }
                // 切换任务栏标签为激活状态
                const tabImage = document.getElementById('tabImage');
                if (tabImage) {
                    tabImage.src = 'img/任务xxdzDM_alpha1.png';
                }
                // 置顶窗口
                windowCounter++;
                newWindowEl.style.zIndex = 9999 + windowCounter;
                if (blurEl) {
                    blurEl.style.zIndex = 9998 + windowCounter;
                }
            });
        }
        // 初始绑定
        bindWindowClick();

        // 点击桌面其他地方让窗口失去焦点
        document.getElementById('desktop').addEventListener('mousedown', (e) => {
            const windowEl = getWindowEl();
            if (!windowEl) return;
            if (!windowEl.contains(e.target)) {
                windowEl.classList.add('inactive');
                // 降低模糊层模糊程度
                const blurEl = document.getElementById('windowBlur');
                if (blurEl) {
                    blurEl.style.backdropFilter = 'blur(3px)';
                    blurEl.style.webkitBackdropFilter = 'blur(3px)';
                }
                // 切换任务栏标签为失焦状态
                const tabImage = document.getElementById('tabImage');
                if (tabImage) {
                    tabImage.src = 'img/任务xxdzDM_alpha2.png';
                }
            }
        });

        // ============ 聚焦窗口函数（点击任务栏标签时调用） ============
        function focusWindow() {
            const windowEl = getWindowEl();
            if (!windowEl) return;
            const tabImage = document.getElementById('tabImage');
            // 如果窗口未显示，先显示窗口
            if (!windowEl.classList.contains('show')) {
                showWindow();
            } else {
                // 如果已显示，只激活窗口
                windowEl.classList.remove('inactive');
                // 恢复模糊层模糊程度
                const blurEl = document.getElementById('windowBlur');
                if (blurEl) {
                    blurEl.style.backdropFilter = 'blur(10px)';
                    blurEl.style.webkitBackdropFilter = 'blur(10px)';
                    // 置顶主窗口的模糊层
                    windowCounter++;
                    blurEl.style.zIndex = 9998 + windowCounter;
                }
                // 切换任务栏标签为激活状态
                if (tabImage) {
                    tabImage.src = 'img/任务xxdzDM_alpha1.png';
                }
                // 将窗口置于顶层
                windowCounter++;
                windowEl.style.zIndex = 9999 + windowCounter;
                // 同时更新所有其他标签的状态为失焦
                document.querySelectorAll('.taskbar-tab img').forEach(img => {
                    if (img.id !== 'tabImage') {
                        img.src = 'img/任务xxdzDM_alpha2.png';
                    }
                });
                // 确保主标签是激活状态
                if (tabImage) {
                    tabImage.src = 'img/任务xxdzDM_alpha1.png';
                }
            }
        }

        // ============ 任务栏标签高光跟随鼠标 ============
        const taskbarTab = document.getElementById('taskbarTab');
        const tabGlowMask = document.getElementById('tabGlowMask');

        if (taskbarTab && tabGlowMask) {
            taskbarTab.addEventListener('mousemove', (e) => {
                const rect = taskbarTab.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;

        // ============ 设置图标大小 ============
        function setIconSize(size) {
            const iconItems = document.querySelectorAll('.desktop-icon-item');
            let width, height, marginBottom, bgWidth, highlightWidth, highlightHeight, highlightOffsetX, highlightOffsetY;
            let positions = [];

            switch(size) {
                case 'lg':
                    width = 138;
                    height = 153;
                    marginBottom = -50;
                    bgWidth = 138;
                    highlightWidth = 135;
                    highlightHeight = 141;
                    highlightOffsetX = -10;
                    highlightOffsetY = -10;
                    positions = [0, -153, -306, -459, -612, -765];
                    break;
                case 'sm':
                    width = 92;
                    height = 102;
                    marginBottom = -34;
                    bgWidth = 92;
                    highlightWidth = 89;
                    highlightHeight = 94;
                    highlightOffsetX = -5;
                    highlightOffsetY = -5;
                    positions = [0, -102, -204, -306, -408, -510];
                    break;
                case 'md':
                default:
                    width = 125;
                    height = 138;
                    marginBottom = -46;
                    bgWidth = 125;
                    highlightWidth = 122;
                    highlightHeight = 126;
                    highlightOffsetX = -7;
                    highlightOffsetY = -8;
                    positions = [0, -138, -276, -414, -552, -690];
                    break;
            }

            iconItems.forEach((item, index) => {
                // 设置图标大小
                item.style.width = width + 'px';
                item.style.height = height + 'px';
                item.style.marginBottom = marginBottom + 'px';

                // 设置精灵图背景大小和位置
                const img = item.querySelector('.icon-image');
                if (img) {
                    img.style.backgroundSize = bgWidth + 'px ' + (height * 6) + 'px';
                    img.style.backgroundPosition = '0 ' + positions[index] + 'px';
                }

                // 调整高亮层大小
                const highlight = item.querySelector('.icon-highlight');
                if (highlight) {
                    highlight.style.width = highlightWidth + 'px';
                    highlight.style.height = highlightHeight + 'px';
                    highlight.style.transform = 'translate(calc(-50% + ' + highlightOffsetX + 'px), calc(-50% + ' + highlightOffsetY + 'px))';
                }
            });

            // 保存当前大小到 localStorage
            localStorage.setItem('iconSize', size);
            console.log('[DEBUG] 图标大小已切换为: ' + size);
        }

        // ============ 加载保存的图标大小设置 ============

        // ============ 显示网页窗口（支持指定位置） ============
        function showWindowAtPosition(leftOffset, topOffset) {
            const windowEl = document.getElementById('mainWindow');
            const blurEl = document.getElementById('windowBlur');
            const titlebar = document.getElementById('titlebar');
            const taskbarTab = document.getElementById('taskbarTab');

            // 重置display属性，允许重新显示
            windowEl.style.display = '';
            blurEl.style.display = '';
            titlebar.style.display = '';

            // 先确保元素显示，但初始位置在屏幕外，防止闪烁
            windowEl.style.opacity = '0';
            blurEl.style.opacity = '0';
            titlebar.style.opacity = '0';

            windowEl.classList.add('show');
            blurEl.classList.add('show');
            titlebar.classList.add('show');
            // 确保任务栏标签显示（重置所有样式并触发动画）
            taskbarTab.style.display = '';
            taskbarTab.style.opacity = '';
            taskbarTab.style.width = '';
            taskbarTab.style.animation = '';  // 移除 animation: none，让动画重新执行
            // 移除可能残留的类，重新添加 show 类触发动画
            taskbarTab.classList.remove('show', 'closing');
            // 强制回流
            void taskbarTab.offsetWidth;
            taskbarTab.classList.add('show');

            // 强制激活窗口，移除inactive状态
            windowEl.classList.remove('inactive');

            // 恢复模糊层模糊程度
            if (blurEl) {
                blurEl.style.backdropFilter = 'blur(10px)';
                blurEl.style.webkitBackdropFilter = 'blur(10px)';
            }

            // 切换任务栏标签为激活状态
            const tabImage = document.getElementById('tabImage');
            if (tabImage) {
                tabImage.src = 'img/任务xxdzDM_alpha1.png';
            }

            // 将窗口置于顶层
            windowEl.style.zIndex = 9999 + windowCounter;

            // 设置位置
            if (leftOffset !== undefined && topOffset !== undefined) {
                const desktopRect = document.getElementById('desktop').getBoundingClientRect();
                // 获取窗口当前尺寸
                const windowWidth = 463;
                const windowHeight = 213;
                // 计算位置，确保不超出屏幕
                let left = leftOffset;
                let top = topOffset;
                if (left + windowWidth > window.innerWidth) {
                    left = window.innerWidth - windowWidth - 10;
                }
                if (top + windowHeight > window.innerHeight - 48) {
                    top = window.innerHeight - windowHeight - 48 - 10;
                }
                if (left < 0) left = 10;
                if (top < 0) top = 10;

                windowEl.style.left = left + 'px';
                windowEl.style.top = top + 'px';
                windowEl.style.marginLeft = '0px';
                windowEl.style.marginTop = '0px';
                // 模糊层跟随窗口
                if (blurEl) {
                    blurEl.style.left = (left + 12) + 'px';
                    blurEl.style.top = (top + 11) + 'px';
                    blurEl.style.marginLeft = '0px';
                    blurEl.style.marginTop = '0px';
                }
            }

            // 多次延迟同步模糊层位置，确保动画完成后位置正确
            setTimeout(function() {
                syncBlurPosition();
                windowEl.style.opacity = '';
                blurEl.style.opacity = '';
                titlebar.style.opacity = '';
            }, 50);

            setTimeout(syncBlurPosition, 150);
            setTimeout(syncBlurPosition, 300);

            windowCounter++;
            console.log('[DEBUG]  网页窗口已显示 (#', windowCounter, ')');

            // 播放音效 - 第一个窗口也播放
            try {
                const audio = new Audio('img/7严重停止.wav');
                audio.volume = 0.45;
                audio.play().catch(e => console.log('[DEBUG] 音效播放失败:', e));
            } catch(e) {
                console.log('[DEBUG] 音效加载失败:', e);
            }
        }

        // ============ 重置所有窗口状态（恢复主窗口） ============
        function resetAllWindows() {

                mainWindow.style.opacity = '';

        // ============ 批量生成窗口 ============
        function spawnMultipleWindows() {
            // 获取当前窗口位置
            const windowEl = document.getElementById('mainWindow');
            const rect = windowEl.getBoundingClientRect();
            const desktopRect = document.getElementById('desktop').getBoundingClientRect();

            // 直接从 getBoundingClientRect 获取实际位置
            let baseLeft = rect.left - desktopRect.left;
            let baseTop = rect.top - desktopRect.top;

            // 如果窗口未显示或位置异常，使用默认位置（屏幕中央）
            if (baseLeft < 0 || baseTop < 0 || baseLeft > window.innerWidth || baseTop > window.innerHeight) {
                baseLeft = (window.innerWidth - 463) / 2;
                baseTop = (window.innerHeight - 213 - 48) / 2;
            }

            console.log('[DEBUG] 📍 克隆窗口基准位置: left=' + baseLeft + ', top=' + baseTop);

            // 生成10个窗口，位置依次向右下方偏移
            for (let i = 1; i <= 10; i++) {
                const offsetX = 30 * i;
                const offsetY = 30 * i;

                // 使用setTimeout让每个窗口依次出现，有层次感
                setTimeout(() => {
                    // 克隆窗口元素（但不克隆任务栏标签）
                    const newWindowEl = windowEl.cloneNode(true);
                    const newBlurEl = document.getElementById('windowBlur').cloneNode(true);

                    // 移除克隆窗口中的任务栏标签（防止主标签被克隆）
                    const clonedTaskbarTab = newWindowEl.querySelector('.taskbar-tab');
                    if (clonedTaskbarTab) {
                        clonedTaskbarTab.remove();
                    }

                    // 为新窗口生成唯一ID
                    const windowId = 'window_' + Date.now() + '_' + i;
                    const blurId = 'blur_' + Date.now() + '_' + i;

                    // 设置窗口位置
                    const left = baseLeft + offsetX;
                    const top = baseTop + offsetY;

                    // 配置新窗口
                    newWindowEl.id = windowId;
                    newWindowEl.className = 'window show';
                    newWindowEl.style.position = 'absolute';
                    newWindowEl.style.left = left + 'px';
                    newWindowEl.style.top = top + 'px';
                    newWindowEl.style.marginLeft = '0px';
                    newWindowEl.style.marginTop = '0px';
                    newWindowEl.style.display = 'block';
                    newWindowEl.style.opacity = '';
                    newWindowEl.style.pointerEvents = 'auto';
                    newWindowEl.style.zIndex = 9999 + windowCounter;
                    newWindowEl.dataset.windowIndex = windowCounter;

                    // 播放音效
                    try {
                        const audio = new Audio('img/7严重停止.wav');
                        audio.volume = 0.45;
                        audio.play().catch(e => console.log('[DEBUG] 音效播放失败:', e));

                    taskbarTabNew.addEventListener('mousemove', function(e) {

                    });

                    // 任务栏标签点击事件 - 激活对应窗口
                    taskbarTabNew.addEventListener('click', function() {
                        // 激活窗口
                        activateWindow(newWindowEl, newBlurEl);
                        // 置顶
                        windowCounter++;
                        newWindowEl.style.zIndex = 9999 + windowCounter;

                        document.querySelectorAll('.taskbar-tab img').forEach(img => {

                    // 将新标签添加到任务栏中间区域
                    taskbarMiddle.appendChild(taskbarTabNew);
                    // 重排所有任务栏标签
                    rearrangeTaskbarTabs();

                    // 为标题栏添加拖动功能和置顶（包含边缘检测）
                    if (newTitlebar) {
                        const winEl = newWindowEl;
                        const blurElRef = newBlurEl;
                        let isDraggingLocal = false;
                        let dragOffsetXLocal = 0;
                        let dragOffsetYLocal = 0;
                        let edgeTriggeredLocal = false;

                        // 点击标题栏时置顶窗口
                        newTitlebar.addEventListener('mousedown', function(e) {

                            currentlyDraggingWindow = winEl;
                            // 激活此窗口（置顶）
                            activateWindow(winEl, blurElRef);

                            // 提高z-index确保置顶
                            windowCounter++;
                            winEl.style.zIndex = 9999 + windowCounter;
                            if (blurElRef) {
                                blurElRef.style.zIndex = 9998 + windowCounter;

                            isDraggingLocal = true;
                            edgeTriggeredLocal = false;
                            const rect = winEl.getBoundingClientRect();
                            dragOffsetXLocal = e.clientX - rect.left;
                            dragOffsetYLocal = e.clientY - rect.top;
                            winEl.style.cursor = 'grabbing';

                            function onDragLocal(ev) {
                                if (!isDraggingLocal) return;
                                const desktopRect2 = document.getElementById('desktop').getBoundingClientRect();
                                let x = ev.clientX - desktopRect2.left - dragOffsetXLocal;
                                let y = ev.clientY - desktopRect2.top - dragOffsetYLocal;

                                winEl.style.top = y + 'px';
                                if (blurElRef) {
                                    blurElRef.style.left = (x + 12) + 'px';
                                    blurElRef.style.top = (y + 11) + 'px';
                                }

                                // ===== 检测窗口是否完全移出屏幕（独立判断，不受边缘触发影响） =====
                                const winRect2 = winEl.getBoundingClientRect();
                                const isFullyOut2 = (winRect2.right < 0 || winRect2.left > window.innerWidth ||
                                                     winRect2.bottom < 0 || winRect2.top > window.innerHeight);

                                // ===== 场景2（优先）：窗口完全移出屏幕 → 销毁窗口 + 触发系统窗口 =====
                                if (isFullyOut2 && !edgeTriggeredLocal) {
                                    console.log('[DEBUG] 🟢 克隆窗口已完全移出屏幕！销毁该窗口及其模糊层');
                                    edgeTriggeredLocal = true;

                                    // 立即获取模糊层和标签引用（在销毁前）
                                    const blurElRef = winEl.nextElementSibling;
                                    let tabEl = null;
                                    const tabs = document.querySelectorAll('.taskbar-tab');
                                    tabs.forEach(tab => {
                                        if (tab.dataset.windowId === winEl.id) {
                                            tabEl = tab;
                                        }
                                    });

                                    // 立即停止拖拽（即使鼠标未抬起）
                                    if (winEl._stopDrag) {
                                        winEl._stopDrag();
                                    }

                                    // 立即从DOM中移除克隆窗口
                                    if (winEl.parentNode) {
                                        winEl.parentNode.removeChild(winEl);
                                    }
                                    // 立即从DOM中移除模糊层
                                    if (blurElRef && blurElRef.parentNode) {
                                        blurElRef.parentNode.removeChild(blurElRef);
                                    }
                                    // 立即从DOM中移除标签
                                    if (tabEl && tabEl.parentNode) {
                                        tabEl.parentNode.removeChild(tabEl);
                                    }
                                    console.log('[DEBUG] 🗑️ 克隆窗口及其模糊层已立即销毁');

                                    // 延迟触发其他窗口物理掉落
                                    setTimeout(() => {
                                        console.log('[DEBUG] ⏰ 当前窗口已销毁，触发其他窗口掉落');
                                        dropAllWindows();
                                    }, 300);
                                    // 同时尝试通知后端（不影响物理效果）
                                    triggerSpawnWindow(ev.clientX, ev.clientY, 'edge');
                                    return; // 销毁后不再执行后续边缘检测
                                }

                                // ===== 场景1：鼠标进入边缘区域 → 仅触发系统窗口，不销毁（仅在未完全移出时生效） =====
                                const EDGE_THRESHOLD = 50;
                                const mouseX2 = ev.clientX;
                                const mouseY2 = ev.clientY;
                                const isMouseAtEdge2 = (mouseX2 < EDGE_THRESHOLD ||
                                                        mouseX2 > window.innerWidth - EDGE_THRESHOLD ||
                                                        mouseY2 < EDGE_THRESHOLD ||
                                                        mouseY2 > window.innerHeight - EDGE_THRESHOLD);

                                if (isMouseAtEdge2 && !edgeTriggeredLocal) {
                                    console.log('[DEBUG] 🟡 鼠标进入边缘区域！触发系统窗口（不销毁当前克隆窗口）');
                                    edgeTriggeredLocal = true;
                                    // 仅触发后端创建系统窗口，不销毁当前窗口
                                    triggerSpawnWindow(ev.clientX, ev.clientY, 'edge');
                                    // 重置 edgeTriggeredLocal，允许再次触发
                                    setTimeout(() => {
                                        edgeTriggeredLocal = false;
                                    }, 500);
                                }
                            }

                            function stopDragLocal() {
                                isDraggingLocal = false;
                                edgeTriggeredLocal = false;
                                currentlyDraggingWindow = null; // 清除拖拽标记
                                winEl.style.cursor = '';
                                document.removeEventListener('mousemove', onDragLocal);
                                document.removeEventListener('mouseup', stopDragLocal);
                            }

                            document.addEventListener('mousemove', onDragLocal);
                            document.addEventListener('mouseup', stopDragLocal);
                        });

                        // 点击窗口本身（非标题栏区域）也置顶
                        winEl.addEventListener('mousedown', function(e) {
                            // 如果点击的是标题栏或关闭按钮，不重复处理
                            if (e.target.closest('.window-titlebar') || e.target.closest('.window-close-btn')) {
                                return;
                            }
                            // 激活此窗口（置顶）
                            activateWindow(winEl, blurElRef);
                            windowCounter++;
                            winEl.style.zIndex = 9999 + windowCounter;
                            if (blurElRef) {
                                blurElRef.style.zIndex = 9998 + windowCounter;
                            }
                        });
                    }

                    // 将新窗口添加到desktop
                    const desktop = document.getElementById('desktop');
                    desktop.appendChild(newBlurEl);
                    desktop.appendChild(newWindowEl);

                    // 激活新窗口（聚焦）- 但先移除所有窗口的焦点状态
                    setTimeout(() => {
                        // 让所有窗口失焦
                        document.querySelectorAll('.window').forEach(w => {
                            w.classList.add('inactive');
                        });
                        document.querySelectorAll('.window-blur').forEach(b => {
                            b.style.backdropFilter = 'blur(3px)';
                            b.style.webkitBackdropFilter = 'blur(3px)';
                        });
                        // 只激活新窗口
                        activateWindow(newWindowEl, newBlurEl);
                    }, 50);

                    windowCounter++;
                    console.log('[DEBUG]  批量窗口 #' + i + ' 已创建');
                }, i * 100); // 每个窗口间隔100ms依次出现
            }

            // ===== 窗口掉落完成后会自动触发重置（由 dropAllWindows 触发） =====
            // 不再需要定时器，由物理引擎完成时自动调用 resetAllWindows
            console.log('[DEBUG] ⏱️ 窗口掉落完成后将自动重置');
        }

        // ============ 激活指定窗口 ============
        function activateWindow(windowEl, blurEl) {
            // 所有窗口失焦（添加inactive类）
            document.querySelectorAll('.window').forEach(w => {
                w.classList.add('inactive');
            });
            // 所有模糊层降低模糊度
            document.querySelectorAll('.window-blur').forEach(b => {
                b.style.backdropFilter = 'blur(3px)';
                b.style.webkitBackdropFilter = 'blur(3px)';
            });
            // 所有任务栏标签失焦
            document.querySelectorAll('.taskbar-tab img').forEach(img => {
                img.src = 'img/任务xxdzDM_alpha2.png';
            });

            // 激活当前窗口（移除inactive类）
            if (windowEl) {
                windowEl.classList.remove('inactive');
                windowEl.style.zIndex = 9999 + windowCounter;
            }
            if (blurEl) {
                blurEl.style.backdropFilter = 'blur(10px)';
                blurEl.style.webkitBackdropFilter = 'blur(10px)';
                blurEl.style.zIndex = 9998 + windowCounter;
            }

            // 找到并激活对应的任务栏标签
            // 对于主窗口，使用主标签
            const mainWindow = document.getElementById('mainWindow');
            if (windowEl === mainWindow) {
                const tabImage = document.getElementById('tabImage');
                if (tabImage) {
                    tabImage.src = 'img/任务xxdzDM_alpha1.png';
                }
            } else {
                // 对于克隆窗口，找到对应的标签
                const allTabs = document.querySelectorAll('.taskbar-tab');
                // 遍历所有标签，找到与窗口关联的标签（通过窗口ID或数据关联）
                // 简单方法：如果窗口有对应的标签，在创建时已绑定点击事件，这里只需要更新所有标签状态
                // 但由于我们无法直接关联，我们遍历所有标签并检查它们的点击事件绑定的窗口
                // 更简单的方法：让所有新标签自己管理自己的状态
                // 这里我们只更新主标签，新标签的激活由各自的事件处理
            }
            // 但为了确保新标签也被激活，我们需要在创建标签时保存引用
            // 由于新标签的点击事件已经调用了activateWindow并更新了主标签，
            // 我们需要额外更新所有标签状态
            // 简单修复：更新所有标签状态
            document.querySelectorAll('.taskbar-tab img').forEach(img => {
                // 如果某个标签的父级是主标签，则跳过（主标签由上面处理）
                const parent = img.closest('.taskbar-tab');
                if (parent && parent.id === 'taskbarTab') {
                    // 主标签已经在上面处理了
                } else {
                    // 新标签暂时设为失焦，由它们的点击事件处理
                    // 但这里我们无法知道哪个标签对应哪个窗口
                    // 所以我们只更新主标签，新标签由各自的事件处理
                }
            });
        }

        // ============ 重排任务栏标签 ============
        function rearrangeTaskbarTabs() {
            const allTabs = document.querySelectorAll('.taskbar-tab');
            const tabs = document.querySelectorAll('.taskbar-tab:not(#taskbarTab)');

            // 获取任务栏中间区域的宽度
            const taskbarMiddle = document.querySelector('.taskbar-middle');
            const middleWidth = taskbarMiddle ? taskbarMiddle.clientWidth : window.innerWidth - 80;

            // 每个标签的默认宽度
            const defaultTabWidth = 160;
            const startOffset = 3; // 第一个标签的起始位置
            const totalTabs = allTabs.length;

            // 计算可用宽度（减去起始位置和标签之间的间隙）
            const gap = 2;
            const availableWidth = middleWidth - startOffset - (totalTabs > 0 ? (totalTabs - 1) * gap : 0);

            // 计算每个标签的宽度：默认160px，但如果不够则缩小
            let tabWidth = defaultTabWidth;
            if (totalTabs > 0 && availableWidth / totalTabs < defaultTabWidth) {
                tabWidth = Math.max(availableWidth / totalTabs, 60);
            }
            tabWidth = Math.floor(tabWidth);

            console.log('[DEBUG] 📐 重排任务栏标签: 总数=' + totalTabs + ', 宽度=' + tabWidth + 'px');

            // 先设置所有标签（包括主标签）的宽度和位置
            allTabs.forEach((tab, index) => {
                const leftPos = startOffset + index * (tabWidth + gap);
                tab.style.transition = 'left 0.2s ease-out, width 0.2s ease-out';
                tab.style.left = leftPos + 'px';
                tab.style.width = tabWidth + 'px';

                // 标签内的图片也调整宽度
                const img = tab.querySelector('img');
                if (img) {
                    img.style.width = tabWidth + 'px';
                    img.style.height = '38px';
                }
            });
        }

        // ============ 关闭指定窗口 ============
        function closeSpecificWindow(windowEl, blurEl, taskbarTabEl) {
            if (!windowEl) return;

            // 添加关闭动画
            windowEl.classList.add('closing');
            if (blurEl) {
                blurEl.classList.add('closing');
            }
            if (taskbarTabEl) {
                // 任务栏标签使用关闭动画（与主标签一致）
                taskbarTabEl.classList.add('closing');
                // 强制触发动画
                taskbarTabEl.style.animation = 'none';
                void taskbarTabEl.offsetWidth;
                taskbarTabEl.style.animation = '';
            }

            setTimeout(() => {
                if (windowEl.parentNode) {
                    windowEl.parentNode.removeChild(windowEl);
                }
                if (blurEl && blurEl.parentNode) {
                    blurEl.parentNode.removeChild(blurEl);
                }
                if (taskbarTabEl && taskbarTabEl.parentNode) {
                    taskbarTabEl.parentNode.removeChild(taskbarTabEl);
                }
                // 重排剩余任务栏标签
                rearrangeTaskbarTabs();
                console.log('[DEBUG]  指定窗口已关闭');
            }, 160);
        }

        // ============ 关闭网页窗口 ============
        let isClosing = false;

        function closeWindow() {

            isClosing = true;

            const windowEl = document.getElementById('mainWindow');

        // ============ 关闭按钮事件 ============
        const closeBtn = document.getElementById('windowCloseBtn');

            closeBtn.addEventListener('click', function(e) {

        // ============ 物理引擎（支持窗口和方块掉落 + 任务栏弹性反馈） ============
        const selection = document.getElementById('desktopSelection');
        let isSelecting = false;
        let selectStartX = 0;
        let selectStartY = 0;
        let droppedBlocks = [];
        let physicsFrameId = null;
        const GRAVITY = 0.8;        // 增大重力，下落更快
        const BOUNCE = 0.5;         // 增大弹力，弹得更高
        const FRICTION = 0.95;      // 减少水平阻力
        const TASKBAR_HEIGHT = 48;
        let taskbarBounceActive = false;

        if (typeof desktop === 'undefined') {
            var desktop = document.getElementById('desktop');
        }
        const taskbarEl = document.querySelector('.taskbar');

        // 任务栏弹性反馈（每次撞击都触发，快速复位）
        let taskbarBounceTimer = null;
        function triggerTaskbarBounce() {
            if (!taskbarEl) return;
            // 清除之前的定时器，重新开始
            if (taskbarBounceTimer) {
                clearTimeout(taskbarBounceTimer);
                taskbarBounceTimer = null;
            }
            // 立即下压
            taskbarEl.style.transition = 'transform 0.06s ease-out';
            taskbarEl.style.transform = 'translateY(10px)';
            // 短暂延迟后弹回
            taskbarBounceTimer = setTimeout(() => {
                taskbarEl.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
                taskbarEl.style.transform = 'translateY(0px)';
                taskbarBounceTimer = setTimeout(() => {
                    taskbarEl.style.transition = '';
                    taskbarEl.style.transform = '';
                    taskbarBounceTimer = null;
                }, 300);
            }, 60);
        }

        // 创建桌面选区方块（保留原功能）
        function createDropBlock(left, top, width, height) {
            const block = document.createElement('div');
            block.className = 'drop-block';
            block.style.position = 'absolute';
            block.style.left = left + 'px';
            block.style.top = top + 'px';
            block.style.width = width + 'px';
            block.style.height = height + 'px';
            block.style.border = '1px solid rgba(0, 120, 215, 0.8)';
            block.style.background = 'rgba(0, 120, 215, 0.15)';
            block.style.pointerEvents = 'none';
            block.style.zIndex = '0';
            block.velocityX = (Math.random() - 0.5) * 2;
            block.velocityY = 0;
            block.grounded = false;
            block.isFalling = true;
            block.bounceCount = 0;
            block.origWidth = width;
            block.origHeight = height;
            desktop.appendChild(block);
            droppedBlocks.push(block);
            return block;
        }

        // ============ 核心：让所有网页窗口物理掉落（重构版 - 使用 CSS 动画 + JS 控制） ============
        // 全局变量：记录当前正在拖拽的窗口，排除它不掉落
        let currentlyDraggingWindow = null;
        let windowDropAnimId = 0;
        let windowDropTimers = [];

        function dropAllWindows() {
            // ===== 全新的基于 requestAnimationFrame 的物理掉落引擎 =====
            const allWindows = document.querySelectorAll('.window:not(.closing)');
            const allBlurs = document.querySelectorAll('.window-blur:not(.closing)');
            const allTabs = document.querySelectorAll('.taskbar-tab');
            const floorY = window.innerHeight - TASKBAR_HEIGHT; // 任务栏顶部 Y 坐标
            const GRAVITY = 0.8;          // 重力加速度（像素/帧²）- 增大让下落更快更明显
            const BOUNCE = 0.78;          // 弹性系数（0~1）- 增大让弹跳更持久，衰减更慢
            const FRICTION = 0.99;        // 水平摩擦
            const VEL_THRESHOLD = 1.2;    // 速度阈值，低于此值触发“最后一弹”并穿透

            console.log('[DEBUG] 💥 触发所有窗口物理掉落！窗口数量:', allWindows.length);
            if (currentlyDraggingWindow) {
                console.log('[DEBUG] 🚫 排除正在拖拽的窗口:', currentlyDraggingWindow.id);
            }

            if (allWindows.length === 0) {
                console.log('[DEBUG] ⚠️ 没有窗口可掉落');
                return;
            }

            // 取消之前的物理循环
            if (window.windowPhysicsId) {
                cancelAnimationFrame(window.windowPhysicsId);
                window.windowPhysicsId = null;
            }
            // 清除旧定时器（如果有）
            if (windowDropTimers) {
                windowDropTimers.forEach(t => clearTimeout(t));
                windowDropTimers = [];
            }

            // 构建物理体列表（排除正在拖拽的窗口）
            let bodies = [];
            allWindows.forEach((win, idx) => {
                if (win === currentlyDraggingWindow) return;
                if (win.style.display === 'none') return;

                // 获取当前绝对位置（left/top 可能是 px 字符串或空）
                let left = parseFloat(win.style.left);
                let top = parseFloat(win.style.top);
                // 若没有有效值，使用 getBoundingClientRect 计算相对桌面的位置
                if (isNaN(left) || isNaN(top)) {
                    const rect = win.getBoundingClientRect();
                    const dRect = desktop.getBoundingClientRect();
                    left = rect.left - dRect.left;
                    top = rect.top - dRect.top;
                }
                // 防止初始位置过低（直接卡在任务栏上）
                if (top + win.offsetHeight > floorY - 20) {
                    top = 30 + Math.random() * 120;
                }

                // 对应的模糊层和任务栏标签（按索引匹配）
                const blur = allBlurs[idx] || null;
                const tab = allTabs[idx] || null;   // 注意：allTabs 顺序与窗口一致（主窗口在主标签）

                bodies.push({
                    win: win,
                    blur: blur,
                    tab: tab,
                    left: left,
                    top: top,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: 0,
                    width: win.offsetWidth || 463,
                    height: win.offsetHeight || 213,
                    penetrating: false,   // 是否已穿透任务栏（不再反弹）
                    removed: false,
                    bounceCount: 0        // 弹跳计数器
                });
            });

            if (bodies.length === 0) {
                console.log('[DEBUG] ⚠️ 没有可掉落的窗口（全部被排除）');
                return;
            }

            // 任务栏弹性状态（防重复触发）
            let bounceActive = false;
            function triggerBounce() {
                if (bounceActive) return;
                bounceActive = true;
                triggerTaskbarBounce();    // 调用已有的任务栏弹跳函数
                setTimeout(() => { bounceActive = false; }, 300);
            }

            // 物理更新循环 - 固定 5 次弹跳，自然衰减
            function physicsLoop() {
                let allRemoved = true;

                bodies.forEach(body => {
                    if (body.removed) return;

                    // 应用重力与摩擦
                    body.vy += GRAVITY;
                    body.vx *= FRICTION;
                    body.left += body.vx;
                    body.top += body.vy;

                    // 左右边界碰撞
                    if (body.left < 0) {
                        body.left = 0;
                        body.vx = -body.vx * 0.5;
                    } else if (body.left + body.width > window.innerWidth) {
                        body.left = window.innerWidth - body.width;
                        body.vx = -body.vx * 0.5;
                    }

                    // 检测底部是否触及任务栏顶部
                    const bottom = body.top + body.height;
                    if (bottom >= floorY && !body.penetrating) {
                        // 撞击任务栏
                        body.top = floorY - body.height;

                        if (body.bounceCount < 3) {
                            // 前 3 次：正常反弹（自然衰减）
                            body.vy = -body.vy * BOUNCE;
                            body.bounceCount++;
                            if (!bounceActive) triggerBounce();
                        } else {
                            // 第 3 次之后：直接穿透，不再反弹
                            body.penetrating = true;
                            // 注意：不设置 vy，保持当前速度（可能是很小的向下速度）
                            // 让重力自然加速，产生自由落体效果
                            // 最后一次撞击触发任务栏弹跳
                            if (!bounceActive) triggerBounce();
                        }
                    }

                    // 更新 DOM 位置
                    body.win.style.left = body.left + 'px';
                    body.win.style.top = body.top + 'px';
                    body.win.style.marginLeft = '0px';
                    body.win.style.marginTop = '0px';
                    if (body.blur) {
                        body.blur.style.left = (body.left + 12) + 'px';
                        body.blur.style.top = (body.top + 11) + 'px';
                        body.blur.style.marginLeft = '0px';
                        body.blur.style.marginTop = '0px';
                    }

                    // 判断是否完全掉出屏幕
                    if (body.top > window.innerHeight + 200) {
                        body.removed = true;
                        body.win.style.display = 'none';
                        if (body.blur) {
                            body.blur.style.display = 'none';
                            // 从DOM中移除模糊层
                            if (body.blur.parentNode) {
                                body.blur.parentNode.removeChild(body.blur);
                            }
                        }
                        // 从DOM中移除窗口
                        if (body.win.parentNode) {
                            body.win.parentNode.removeChild(body.win);
                        }
                        // 任务栏标签执行关闭动画并移除
                        if (body.tab && body.tab.parentNode) {
                            body.tab.classList.add('closing');
                            // 动画结束后移除
                            setTimeout(() => {
                                if (body.tab && body.tab.parentNode) {
                                    body.tab.parentNode.removeChild(body.tab);
                                    // 重排剩余标签
                                    rearrangeTaskbarTabs();
                                }
                            }, 160);
                        }
                        console.log('[DEBUG] 🪟 窗口已掉落出屏幕，已销毁');
                    } else {
                        allRemoved = false;
                    }
                });

                // 继续循环或结束
                if (!allRemoved) {
                    window.windowPhysicsId = requestAnimationFrame(physicsLoop);
                } else {
                    window.windowPhysicsId = null;
                    console.log('[DEBUG] ✅ 所有窗口已掉落完毕');
                    // ===== 窗口掉落完成后，自动重置所有窗口 =====
                    console.log('[DEBUG] 🔄 窗口已全部掉落，自动触发重置...');
                    // 延迟一点点让DOM更新完成
                    setTimeout(() => {
                        resetAllWindows();
                    }, 300);
                }
            }

            // 启动物理循环
            window.windowPhysicsId = requestAnimationFrame(physicsLoop);
        }

        // 保留原有方块物理（用于桌面选区）- 添加方块间碰撞
        function updatePhysics() {
            const floorY = window.innerHeight - TASKBAR_HEIGHT;
            let moving = false;

            // 先更新所有方块的位置和速度
            droppedBlocks.forEach(block => {
                if (!block.isFalling) return;
                block.velocityY += GRAVITY;
                block.velocityX *= FRICTION;
                let l = parseFloat(block.style.left);
                let t = parseFloat(block.style.top);
                l += block.velocityX;
                t += block.velocityY;

                // 屏幕边界碰撞
                if (l < 0) { l = 0; block.velocityX = -block.velocityX * BOUNCE; }
                else if (l + block.origWidth > window.innerWidth) {
                    l = window.innerWidth - block.origWidth;
                    block.velocityX = -block.velocityX * BOUNCE;
                }
                if (t + block.origHeight > floorY) {
                    t = floorY - block.origHeight;
                    block.velocityY = -block.velocityY * BOUNCE;
                    if (Math.abs(block.velocityY) < 0.5) {
                        block.velocityY = 0;
                        block.grounded = true;
                    }
                } else { block.grounded = false; }
                if (t < 0) { t = 0; block.velocityY = -block.velocityY * BOUNCE; }
                if (t > window.innerHeight + 100) {
                    block.isFalling = false;
                    block.style.display = 'none';
                    if (block.parentNode) block.parentNode.removeChild(block);
                    return;
                }
                block.style.left = l + 'px';
                block.style.top = t + 'px';
                if (Math.abs(block.velocityX) > 0.1 || Math.abs(block.velocityY) > 0.1) moving = true;
            });

            // 过滤掉已移除的方块
            droppedBlocks = droppedBlocks.filter(b => b.style.display !== 'none');

            // ===== 方块间碰撞检测（简化版：弹性碰撞） =====
            for (let i = 0; i < droppedBlocks.length; i++) {
                for (let j = i + 1; j < droppedBlocks.length; j++) {
                    const a = droppedBlocks[i];
                    const b = droppedBlocks[j];
                    if (!a.isFalling && !b.isFalling) continue; // 两个都静止则跳过

                    const ax = parseFloat(a.style.left);
                    const ay = parseFloat(a.style.top);
                    const bx = parseFloat(b.style.left);
                    const by = parseFloat(b.style.top);
                    const aw = a.origWidth;
                    const ah = a.origHeight;
                    const bw = b.origWidth;
                    const bh = b.origHeight;

                    // 检测是否重叠（AABB碰撞检测）
                    if (ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by) {
                        // 计算重叠量
                        const overlapX = Math.min(ax + aw - bx, bx + bw - ax);
                        const overlapY = Math.min(ay + ah - by, by + bh - ay);

                        // 选择重叠较小的方向进行分离（更自然的碰撞响应）
                        if (overlapX < overlapY) {
                            // 水平方向分离
                            if (ax < bx) {
                                a.style.left = (ax - overlapX / 2) + 'px';
                                b.style.left = (bx + overlapX / 2) + 'px';
                            } else {
                                a.style.left = (ax + overlapX / 2) + 'px';
                                b.style.left = (bx - overlapX / 2) + 'px';
                            }
                            // 交换水平速度（弹性碰撞）
                            const tempVx = a.velocityX;
                            a.velocityX = b.velocityX * 0.8;
                            b.velocityX = tempVx * 0.8;
                            // 如果两个都静止，给一个微小速度让它们分开
                            if (Math.abs(a.velocityX) < 0.1 && Math.abs(b.velocityX) < 0.1) {
                                a.velocityX = (ax < bx ? -0.5 : 0.5);
                                b.velocityX = (ax < bx ? 0.5 : -0.5);
                            }
                            moving = true;
                        } else {
                            // 垂直方向分离
                            if (ay < by) {
                                a.style.top = (ay - overlapY / 2) + 'px';
                                b.style.top = (by + overlapY / 2) + 'px';
                            } else {
                                a.style.top = (ay + overlapY / 2) + 'px';
                                b.style.top = (by - overlapY / 2) + 'px';
                            }
                            // 交换垂直速度（弹性碰撞）
                            const tempVy = a.velocityY;
                            a.velocityY = b.velocityY * 0.8;
                            b.velocityY = tempVy * 0.8;
                            if (Math.abs(a.velocityY) < 0.1 && Math.abs(b.velocityY) < 0.1) {
                                a.velocityY = (ay < by ? -0.5 : 0.5);
                                b.velocityY = (ay < by ? 0.5 : -0.5);
                            }
                            moving = true;
                        }
                    }
                }
            }

            // 继续或结束物理循环
            if (moving && droppedBlocks.length > 0) {
                physicsFrameId = requestAnimationFrame(updatePhysics);
            } else {
                droppedBlocks.forEach(b => { b.velocityX = 0; b.velocityY = 0; b.isFalling = false; b.grounded = true; });
                physicsFrameId = null;
            }
        }

        function startPhysics() {
            if (physicsFrameId) { cancelAnimationFrame(physicsFrameId); physicsFrameId = null; }
            droppedBlocks.forEach(block => {
                block.isFalling = true;
                if (block.grounded) block.velocityY = -2;
            });
            physicsFrameId = requestAnimationFrame(updatePhysics);
        }

        // 鼠标按下时开始选择
        desktop.addEventListener('mousedown', (e) => {
            // 只对桌面背景生效
            if (e.target === desktop || e.target === selection) {
                if (e.button === 0) {
                    isSelecting = true;
                    selectStartX = e.clientX;
                    selectStartY = e.clientY;
                    selection.style.display = 'block';
                    selection.style.left = selectStartX + 'px';
                    selection.style.top = selectStartY + 'px';
                    selection.style.width = '0px';
                    selection.style.height = '0px';
                }
            }
        });

        // 鼠标移动时更新选择框
        document.addEventListener('mousemove', (e) => {
            if (!isSelecting) return;

            const currentX = e.clientX;
            const currentY = e.clientY;

            const left = Math.min(selectStartX, currentX);
            const top = Math.min(selectStartY, currentY);
            const width = Math.abs(currentX - selectStartX);
            const height = Math.abs(currentY - selectStartY);

            selection.style.left = left + 'px';
            selection.style.top = top + 'px';
            selection.style.width = width + 'px';
            selection.style.height = height + 'px';
        });

        // 鼠标松开时结束选择并创建掉落方块
        document.addEventListener('mouseup', (e) => {
            if (isSelecting) {
                isSelecting = false;

                // 获取选择框的最终尺寸
                const left = parseFloat(selection.style.left);
                const top = parseFloat(selection.style.top);
                const width = parseFloat(selection.style.width);
                const height = parseFloat(selection.style.height);

                // 如果选择区域足够大（至少10px），创建掉落方块
                if (width > 10 && height > 10) {
                    createDropBlock(left, top, width, height);
                    // 启动物理模拟
                    setTimeout(startPhysics, 50);
                }

                selection.style.display = 'none';
                selection.style.width = '0px';
                selection.style.height = '0px';
            }
        });

        // ============ 清空所有掉落方块（刷新功能） ============
        function clearDroppedBlocks() {
            droppedBlocks.forEach(block => {
                if (block.parentNode) {
                    block.parentNode.removeChild(block);
                }
            });
            droppedBlocks = [];
            if (physicsFrameId) {
                cancelAnimationFrame(physicsFrameId);
                physicsFrameId = null;
            }
            console.log('[DEBUG] 已清空所有掉落方块');
        }

        // ============ 右键菜单 ============
        const contextMenu = document.getElementById('contextMenu');
        // 直接使用全局的 desktop 变量，不重复声明

        desktop.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const x = e.clientX;
            const y = e.clientY;

            // 先显示菜单以获取实际尺寸
            contextMenu.classList.add('visible');

            // 获取菜单实际尺寸
            const menuWidth = contextMenu.offsetWidth || 220;
            const menuHeight = contextMenu.offsetHeight || 400;

            let left = x;
            let top = y;

            // 确保菜单不超出屏幕右边界
            if (left + menuWidth > window.innerWidth) {
                left = window.innerWidth - menuWidth - 5;
            }
            // 确保菜单不超出屏幕左边界
            if (left < 5) {
                left = 5;
            }
            // 确保菜单不超出屏幕下边界
            if (top + menuHeight > window.innerHeight) {
                top = window.innerHeight - menuHeight - 5;
            }
            // 确保菜单不超出屏幕上边界
            if (top < 5) {
                top = 5;
            }

            // 隐藏菜单重新定位
            contextMenu.classList.remove('visible');
            contextMenu.style.left = left + 'px';
            contextMenu.style.top = top + 'px';

            // 强制回流后显示
            void contextMenu.offsetWidth;
            contextMenu.classList.add('visible');
        });

        // 点击其他地方关闭菜单
        document.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) {
                contextMenu.classList.remove('visible');
            }
        });

        // 右键菜单项点击
        document.querySelectorAll('.context-menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                // 如果是刷新菜单项，执行刷新
                if (item.id === 'refreshMenuItem') {
                    refreshDesktopIcons();
                    clearDroppedBlocks(); // 清空掉落的方块
                    contextMenu.classList.remove('visible');
                }
                // 如果是 has-submenu 项（有子菜单），不关闭菜单
                else if (item.classList.contains('has-submenu')) {
                    // 不关闭菜单，让子菜单保持展开
                    return;
                }
                // 其他菜单项点击后关闭菜单
                else {
                    contextMenu.classList.remove('visible');
                }
            });
        });

        // ============ 二级菜单延迟展开 ============
        let submenuTimer = null;
        let currentSubmenu = null;

        document.querySelectorAll('.context-menu-item.has-submenu').forEach(item => {
            const submenu = item.querySelector('.context-submenu');

            item.addEventListener('mouseenter', () => {
                // 清除之前的定时器
                if (submenuTimer) {
                    clearTimeout(submenuTimer);
                    submenuTimer = null;
                }
                // 隐藏其他子菜单
                document.querySelectorAll('.context-submenu').forEach(sm => {
                    if (sm !== submenu) {
                        sm.style.opacity = '0';
                        sm.style.pointerEvents = 'none';
                    }
                });
                // 延迟显示当前子菜单
                submenuTimer = setTimeout(() => {
                    submenu.style.opacity = '1';
                    submenu.style.pointerEvents = 'auto';
                    currentSubmenu = submenu;
                    submenuTimer = null;
                }, 500);
            });

            item.addEventListener('mouseleave', () => {
                // 清除定时器
                if (submenuTimer) {
                    clearTimeout(submenuTimer);
                    submenuTimer = null;
                }
                // 延迟隐藏子菜单（给用户移动到子菜单的时间）
                setTimeout(() => {
                    // 检查鼠标是否在子菜单上
                    const isHoveringSubmenu = submenu.matches(':hover') || submenu.contains(document.activeElement);
                    if (!isHoveringSubmenu) {
                        submenu.style.opacity = '0';
                        submenu.style.pointerEvents = 'none';
                        if (currentSubmenu === submenu) {
                            currentSubmenu = null;
                        }
                    }
                }, 100);
            });
        });

        // 子菜单悬停时保持显示
        document.querySelectorAll('.context-submenu').forEach(submenu => {
            submenu.addEventListener('mouseenter', () => {
                if (submenuTimer) {
                    clearTimeout(submenuTimer);
                    submenuTimer = null;
                }
                submenu.style.opacity = '1';
                submenu.style.pointerEvents = 'auto';
                currentSubmenu = submenu;
            });

            submenu.addEventListener('mouseleave', () => {
                setTimeout(() => {
                    submenu.style.opacity = '0';
                    submenu.style.pointerEvents = 'none';
                    if (currentSubmenu === submenu) {
                        currentSubmenu = null;
                    }
                }, 100);
            });
        });

        // 阻止子菜单点击冒泡，并防止关闭父菜单
        document.querySelectorAll('.context-submenu').forEach(submenu => {
            submenu.addEventListener('click', (e) => {
                e.stopPropagation();
                // 子菜单项点击不关闭父菜单
                // 但如果点击的是子菜单中的选项，可以执行相应操作
                const target = e.target.closest('.context-menu-item');
                if (target && !target.classList.contains('has-submenu')) {
                    // 子菜单项点击后不关闭父菜单（保持菜单打开）
                    // 但可以在这里添加子菜单项的功能
                }
            });
        });

        // ============ 开始菜单功能 ============
        const startBtn = document.querySelector('.start-btn');
        const startMenu = document.getElementById('startMenu');
        const spriteDefault = document.querySelector('.start-btn-sprite-default');
        const spriteHover = document.querySelector('.start-btn-sprite-hover');
        const spriteActive = document.querySelector('.start-btn-sprite-active');
        let menuOpen = false;

        // 点击精灵图切换菜单（只绑定到精灵图，而不是整个按钮）
        function bindSpriteClick() {
            // 移除所有精灵图上的旧监听器（用新监听器替换）
            [spriteDefault, spriteHover, spriteActive].forEach(sprite => {
                if (sprite) {
                    const newSprite = sprite.cloneNode(true);
                    sprite.parentNode.replaceChild(newSprite, sprite);
                }
            });

            // 重新获取引用
            const newDefault = document.querySelector('.start-btn-sprite-default');
            const newHover = document.querySelector('.start-btn-sprite-hover');
            const newActive = document.querySelector('.start-btn-sprite-active');

            [newDefault, newHover, newActive].forEach(sprite => {
                if (sprite) {
                    sprite.style.pointerEvents = 'auto';
                    // 移除 cursor 设置，让 CSS 控制光标样式
                    sprite.addEventListener('click', function(e) {
                        e.stopPropagation();
                        toggleMenu();
                    });
                }
            });
        }
        bindSpriteClick();

        function toggleMenu() {
            menuOpen = !menuOpen;
            if (menuOpen) {
                startMenu.style.display = 'block';
                // 强制回流后添加 open 类触发动画
                void startMenu.offsetWidth;
                startMenu.classList.add('open');
                startBtn.classList.add('menu-open');
            } else {
                startMenu.classList.remove('open');
                startBtn.classList.remove('menu-open');
                // 等待动画结束后隐藏
                setTimeout(() => {
                    startMenu.style.display = 'none';
                }, 160);
            }
        }

        // 点击菜单外部关闭菜单
        document.addEventListener('click', function(e) {
            if (menuOpen && !startMenu.contains(e.target) && !startBtn.contains(e.target) &&
                !e.target.closest('.start-btn-sprite')) {
                toggleMenu();
            }
        });

        // 防止菜单内部点击冒泡导致关闭
        startMenu.addEventListener('click', function(e) {
            e.stopPropagation();
        });

        // ============ 拖出窗口到系统（触发物理掉落） ============
        let hasSpawned = false;

        function triggerSpawnWindow(x, y, source) {
            console.log('[DEBUG] triggerSpawnWindow 被调用, 来源:', source, 'hasSpawned:', hasSpawned);
            // 如果已经触发过，不再重复
            if (hasSpawned) {
                console.log('[DEBUG]  已触发过，不再重复');
                return;
            }
            // 只有 edge（拖出边缘）才触发系统窗口
            if (source !== 'edge') {
                console.log('[DEBUG]  非边缘拖出触发，忽略 (来源:', source + ')');
                return;
            }
            hasSpawned = true;
            console.log('[DEBUG]  触发拖出窗口 (来源: ' + source + ')');

            // 通知后端
            fetch('http://127.0.0.1:5000/api/spawn_window', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({}),
            })
            .then(response => response.json())
            .then(data => {
                console.log('[DEBUG]  系统窗口创建成功:', data);
            })
            .catch(err => {
                console.error('[DEBUG]  创建系统窗口失败:', err);
                hasSpawned = false;
            });
        }

    </script>
</body>
</html>
